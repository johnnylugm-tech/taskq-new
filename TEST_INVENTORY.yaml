# TEST_INVENTORY.yaml — Phase 1 SSOT for test naming (1:1 with TRACEABILITY_MATRIX.md §2)
#
# Schema: matches harness contract (harness/templates/TEST_INVENTORY.yaml v1.1)
# — top-level `fr_tests:` and `cross_cutting:` keys grouped by FR/NFR →
# layer → [test names]. These are read by the harness parser
# (harness/core/quality_gate/spec_coverage.py::_flatten_test_names) to
# enforce P1 Naming Authority against P2's TEST_SPEC.md.
#
# The `test_inventory:` block below is an EXTENSION on top of the contract:
# it preserves per-AC traceability metadata (tc_id, ac, test_file,
# cross_ref_frs, cross_ref_nfrs, ac_summary) used by Phase-1 review tooling.
# The parser does NOT read `test_inventory:` — every test name there MUST
# also appear under fr_tests or cross_cutting above.
#
# Each entry corresponds to exactly one AC enumerated in
# `01-requirements/TRACEABILITY_MATRIX.md` §2 (AC ↔ Test-Name Mapping).
# Matrix §2 has 22 rows (10 FR + 12 NFR); ranges like `AC-1.1..AC-1.10`
# are expanded into individual `tc_id` entries below.
#
# Naming convention: `it('test_frNN_acK_descriptive')` per CLAUDE.md
# §Language (D4 spec-coverage matches test titles). This file is the
# P1-derived naming authority that P2 `derive_test_cases.md` preserves
# verbatim in `02-architecture/TEST_SPEC.md`, and P4 expands into
# concrete tests.
#
# Coverage invariants (must hold after any edit):
#   by_fr_total  ==  sum(by_fr.<FR>.tc_count for FR in 22 FRs/NFRs)
#   by_layer_total == sum(by_layer.<L>.count for L in {unit, integration, mutation, benchmark, lint})
#   total_test_cases == sum of all enumerated tc_ids
#   len(flatten(fr_tests) ∪ flatten(cross_cutting)) == 100
#   Every name in fr_tests ∪ cross_cutting MUST appear in test_inventory.tests[*].test_name

format_version: "2.1"  # harness contract v1.1 schema + extended test_inventory.tests[] metadata
generator: "Agent A (Requirements Engineer, Round 2)"
generated_at: "2026-08-22"
mapping_source: "01-requirements/TRACEABILITY_MATRIX.md §2 (AC ↔ Test-Name Mapping)"
mapping_section2_row_count: 22
naming_convention_root:
  FR: "test_frNN_acK_<descriptive>"
  NFR: "test_nfrNN_acK_<descriptive>"

